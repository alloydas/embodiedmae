# EmbodiedMAE-4M Training Configuration (RGB + Depth + PointCloud + Spline)
# Occlusion variant: config_4m.yaml + structured masking + procedural
# occlusion/noise (plant_occlusion.py). The plant at the centre of the frame is
# rarely covered; the border is where neighbouring plants' leaves reach in.
# Preview what these settings produce before training:
#   python vis_plant_occlusion.py --config config_4m_occlusion.yaml

data:
  # data_root: "/work/mech-ai-scratch/alloy/embodiedmae/Dataset/new_data"
  data_root: "/work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K"
  img_size: 224
  num_points: 8196

model:
  model_size: "base"
  mask_ratio: 0.75
  # QAL: sigmoid-weighted, two-sided Euclidean Chamfer distance.
  loss_name: "qal_loss"
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  # Optional additive objective: L_pc = L_QAL + w * L_Sinkhorn.
  # Keep disabled for this clean masking/sampling ablation.
  sinkhorn_loss_weight: 0
  # PyTorch tensorized Sinkhorn on evenly sampled representatives. The full
  # 8196-point clouds are still used by QAL.
  sinkhorn_num_points: 512
  sinkhorn_blur: 0.02
  sinkhorn_p: 2
  sinkhorn_scaling: 0.8
  sinkhorn_backend: "tensorized"
  sinkhorn_debias: true
  pc_loss_weight: 1.0
  # Stabilize FPS token order and preserve each local patch's normalized XYZ.
  pc_deterministic_fps: true
  pc_add_center_coordinates: true
  depth_norm_type: "minmax"
  spline_loss_weight: 5.0    # weight for text cross-entropy loss (value chars only)
  max_leaves: 24             # max leaves per plant (pad shorter plants)
  # Occlusion-like token masking. Changes WHICH tokens are masked (coherent
  # blobs, biased to the frame border), never HOW MANY -- the Dirichlet budget
  # is untouched. Train-time only unless apply_in_eval.
  structured_mask:
    enabled: true
    prob: 0.5              # fraction of training samples using it; rest stay uniform
    center_bias: 1.5       # border vs centre masking preference (field-std units)
    length_scale: 0.35     # blob size, image coords ([-1, 1] across the frame)
    modalities: [rgb, depth, pc]
    shared_field: true     # one "occluder" field hides the same region in all three
    apply_in_eval: false

# Procedural occlusion + sensor noise on the ENCODER INPUT; the loss keeps the
# clean targets (amodal completion). Leaves enter from outside the frame and
# reach toward the centre, so the centre is rarely covered by construction.
occlusion:
  enabled: true
  prob: 0.5                # per-sample chance of occluding leaves
  # Tuned on real val views: 8% of the plant covered on average (p90 16%), but
  # only 1.8% of plant pixels near the centre (r < 0.3) vs 21% at the border
  # (r > 0.6). Raising reach adds coverage but erases that contrast.
  num_leaves: [4, 10]
  reach: [0.5, 1.0]        # leaf length; base sits at 1.1, so 1.0 stops short of the centre
  width: [0.06, 0.14]      # max half-width (0.1 ~ 22 px wide at 224 px)
  bend: 0.25
  heading_jitter_deg: 35
  depth_scale: [0.8, 0.95] # occluder depth / plant's near depth (< 1 = in front)
  rgb_noise_std: 0.02      # per-sample std ~ U(0, max), all samples
  depth_noise_std: 0.01    # multiplicative, foreground only
  pc_noise_std: 0.005      # unit-sphere units
  occlude_pc: true         # drop the points behind the same leaves
  min_pc_keep: 0.5
  eval_occluded: true      # extra occluded val pass -> metrics_occ/* in wandb

training:
  batch_size: 8
  epochs: 2400
  # Lower-LR ablation for the PC precision/recall plateau.
  lr: 5.0e-5
  weight_decay: 0.05
  warmup_epochs: 10
  val_freq: 10

checkpointing:
  # Keep corrected runs separate from checkpoints trained with the old mask/data path.
  output_dir: "./outputs/4m_run_v5_occlusion_structured_mask"
  save_freq: 20
  resume: null

visualization:
  viz_freq: 10
  num_viz_samples: 12

evaluation:
  # Distances use the centroid-zero, unit-radius point-cloud coordinates.
  pc_metric_thresholds: [0.01, 0.02, 0.03]
  pc_metric_chunk_size: 512
  # Reuse the same stochastic token masks at every internal validation epoch.
  val_mask_seed: 42

distributed:
  world_size: 8
  dist_backend: "nccl"
  dist_url: "env://"

system:
  num_workers: 32
  device: "cuda"

wandb:
  use_wandb: true
  wandb_project: "embodied-mae-sorghum"
  wandb_entity: null
  wandb_name: "v5_occlusion_structured_mask"
