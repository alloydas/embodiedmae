data:
  data_root: ./Dataset/new_data
  img_size: 224
  num_points: 8196
model:
  model_size: base
  mask_ratio: 0.75
  pc_loss_weight: 10.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 24
distill:
  teacher_checkpoint: ./outputs/4m_run_v3/checkpoints/checkpoint_epoch_2400.pth
  student_init: ./outputs/4m_run_v3/checkpoints/checkpoint_epoch_2400.pth
  crossmodal_prob: 0.8
  sources:
  - text
  feat_distill_weight: 1.0
  cls_distill_weight: 0.5
  output_distill_weight: 0.0
  distill_masked_only: true
  viz_source: text
training:
  batch_size: 8
  epochs: 25
  lr: 0.0001
  weight_decay: 0.05
  warmup_epochs: 3
  val_freq: 5
checkpointing:
  output_dir: ./outputs/4m_distill_src_text
  save_freq: 5
  resume: null
visualization:
  viz_freq: 20
  num_viz_samples: 6
distributed:
  world_size: 1
  dist_backend: nccl
  dist_url: env://
system:
  num_workers: 14
  device: cuda
wandb:
  use_wandb: true
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: 4m_distill_src_text
