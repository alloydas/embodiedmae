# RGB -> POINT CLOUD with a MASKED SOURCE, full Sorghum_15K.
#
# NOVA COPY of Arm B. Identical config to config_4m_distill_15k_rgb2pc_smr50.yaml
# (the scavenger submission) except for output_dir and wandb_name, which MUST
# differ: two jobs sharing one output_dir race on training_history.json,
# best_model.pth and the checkpoint files, and the wandb run id is restored from
# the checkpoint so they would also report into the same run. That collision
# happened on 2026-09-02 with jobs 12161772/12192480.
#
# Nothing is seeded anywhere in the trainer, so if BOTH copies run they are two
# independent draws of the same configuration -- i.e. a genuine two-seed estimate
# of run-to-run noise, which is the measurement the E2 analysis flagged as missing.
#
# Arm B of a two-arm comparison. Arm A is config_4m_distill_15k_rgb2pc_full.yaml
# (source_mask_ratio 0.0, outputs/4m_distill_15k_rgb2pc_full, best 0.00085254 @ep23).
# EVERY other key here is identical to Arm A -- same teacher, same student_init,
# same lr/batch/epochs/cosine -- so the single variable is how much of the RGB
# source the student is allowed to see.
#
# Comparable to Arm A after all (corrected 2026-09-07). The worry was that hiding
# half the source makes the task strictly harder, putting the Chamfer on a different
# footing -- but source_mask_ratio is applied ONLY on the training path.
# evaluate_crossmodal() calls the model as m(..., visible={src}) and never passes
# source_mask_ratio, so it falls back to the 0.0 default: BOTH arms are validated
# with the RGB source handed over whole. This is a pure train-time regulariser and
# the two arms' mean_gen are measured on identical footing.
#
# One job: from a single RGB render, generate the plant's 3D point cloud.
# Unlike runs A-D (SPECIALIST_DISTILL_rgb2pc_spline.md) the target is PC ALONE,
# not pc+text, so `mean_gen` in this run's history IS the RGB->PC Chamfer and
# nothing else -- the headline number is the metric, with no param term mixed in.
#
# Differences from run D that matter, and why:
#   * target: [pc]        (D was [pc, text]) -- the single number under test.
#   * student_init = the v2 teacher itself, NOT run A's init_ep10_best.pth.
#     Runs B/C/D chained off each other, so each inherited the previous run's
#     drift and its best checkpoint was epoch 1. Starting from the pretrain
#     gives a clean epoch-0 baseline and one undivided cosine.
#   * fresh output_dir -- the sbatch auto-resume picks the highest-numbered
#     checkpoint in its own CKPT_DIR, so sharing a directory with run D would
#     silently resume epoch 30 of a different experiment (this happened on
#     2026-09-02, job 12161772).
#
# Whole dataset: 10,500 train plants x 10 views = 105,000 renders; val 2,250
# plants x 10 = 22,500. Splits are plant-disjoint (verified: 0 id overlap).

data:
  data_root: /work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K
  img_size: 224
  num_points: 8196

model:
  model_size: base
  mask_ratio: 0.80          # matches the v2 teacher's own pretraining regime;
                            # governs the ~1-in-5 full-reconstruction steps.
  loss_name: "qal_loss"     # sigmoid-weighted two-sided Chamfer, as the teacher
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0   # inactive as a target, but still applied on the
                            # 20% full-recon steps
  max_leaves: 24

distill:
  teacher_checkpoint: ./outputs/4m_pretrain_15k_v2_depthfix_qal/teacher_final.pth
  # Student starts as a copy of the teacher. student_init (not resume): resume
  # would restore an optimizer/scheduler from another run.
  student_init:       ./outputs/4m_pretrain_15k_v2_depthfix_qal/teacher_final.pth
  crossmodal_prob: 0.8      # 4 of 5 steps are RGB->PC; the 5th is a normal
                            # Dirichlet full-recon step. At 1.0 the non-target
                            # modalities get no gradient and depth collapses
                            # (+606% in run A); one full-recon step in five
                            # repairs it within a single epoch and holds it.
  sources: [rgb]
  target:  [pc]
  source_mask_ratio: 0.5    # THE VARIABLE UNDER TEST. 0.0 (Arm A) hands the RGB
                            # source over whole -- all 196 tokens -- so the student
                            # infers geometry from a complete photograph and the
                            # source's own recon loss is identically 0. At 0.5 only
                            # 98 tokens survive; the student must infer the point
                            # cloud from half an image, and the masked RGB patches
                            # become real reconstruction targets (so a logged
                            # rgb 0.0000 is no longer expected). Measured effect on
                            # an untrained net: pc loss 3.70 -> 4.28.
                            # The TEACHER stays unmasked -- it sees all four
                            # modalities in full, which is the asymmetry that makes
                            # the distillation target worth anything.
  feat_distill_weight: 1.0  # MSE(student, teacher) decoder features, restricted
                            # by target_token_weight to the 196 PC tokens
  cls_distill_weight: 0.5
  output_distill_weight: 0.0   # outputs supervised by GROUND TRUTH, not by the
                               # teacher's predictions
  distill_masked_only: true
  viz_source: rgb

training:
  batch_size: 16            # x 8 GPUs = global 128. Measured 54.4 GiB/card on
                            # RTX PRO 6000 incl. val+viz (bs24 -> 80.5 GiB, 83%).
  epochs: 100              # MATCHES Arm A's first cosine, which is the schedule that
                          # produced its best (0.00085254 @ep23). Arm A's config now
                          # reads 200 because it was extended mid-flight for a warm
                          # restart; that second cycle only degraded, and comparing
                          # against it would vary the LR schedule as well as the
                          # source masking. 100 epochs at ~8 min is ~13.5 h, inside
                          # the 24 h wall.
  lr: 3.0e-5                # 1e-4 diverged from epoch 10 in run A; 3e-5 is the
                            # highest rate that held.
  weight_decay: 0.05
  warmup_epochs: 5
  val_freq: 1               # every epoch: every prior run peaked at epoch 1-10,
                            # so a coarse grid samples the whole interesting
                            # region at two points.
  val_max_batches: 100      # 1600 val samples, same subset as runs A-D
  max_steps: 0

checkpointing:
  output_dir: ./outputs/4m_distill_15k_rgb2pc_smr50_nova
  save_freq: 5              # every 5 epochs, not 2. At 1.37 GB a checkpoint,
                            # save_freq 2 over 200 epochs is 100 files = 137 GB
                            # on a filesystem at 97%.
  keep_last: 1              # keep only the newest periodic checkpoint; older
                            # ones are pruned after each successful save.
                            # best_model.pth is at output_dir level and is NEVER
                            # pruned, so "last + best" is what survives. It
                            # carries model+optimizer+scheduler+history, so it is
                            # fully resumable on its own. Saves are atomic
                            # (.tmp then os.replace), so a preemption mid-write
                            # cannot destroy the only remaining checkpoint.
  resume: null

visualization:
  viz_freq: 10
  num_viz_samples: 6

distributed:
  world_size: 8
  dist_backend: nccl
  dist_url: env://

system:
  num_workers: 14           # 8 x 14 = 112 workers + 8 mains = 120, inside the
                            # 128-CPU request. 44/rank starved rank 0 at load
                            # 354/360 on this node.
  device: cuda

wandb:
  use_wandb: true
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: distill_15k_rgb2pc_smr50_nova
