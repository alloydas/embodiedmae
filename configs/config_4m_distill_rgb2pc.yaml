# EmbodiedMAE-4M — RGB → POINT-CLOUD specialist distillation.
# True single-target run: every step conditions on RGB only (rest masked) and the
# reconstruction loss + feature distillation + best-model metric are restricted to
# the point cloud (Chamfer). Fresh warm-start from the v3 2400 base, single clean
# cosine over 500 epochs (no warm-restart LR bumps).

data:
  data_root: ./Dataset/new_data
  img_size: 224
  num_points: 8196

model:
  model_size: base
  mask_ratio: 0.75
  pc_loss_weight: 10.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 24

distill:
  teacher_checkpoint: ./outputs/4m_run_v3/checkpoints/checkpoint_epoch_2400.pth
  student_init:       ./outputs/4m_run_v3/checkpoints/checkpoint_epoch_2400.pth
  crossmodal_prob: 1.0          # every step is RGB→PC (no full-recon steps)
  sources: [rgb]                # condition on RGB only
  target: pc                    # train/monitor the point cloud only
  feat_distill_weight: 1.0
  cls_distill_weight: 0.5
  output_distill_weight: 0.0
  distill_masked_only: true
  viz_source: rgb

training:
  batch_size: 8
  epochs: 500
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_epochs: 10
  val_freq: 5

checkpointing:
  output_dir: ./outputs/4m_distill_rgb2pc
  save_freq: 10
  resume: null                  # fresh from student_init (2400 base)

visualization:
  viz_freq: 25
  num_viz_samples: 6

distributed:
  world_size: 1
  dist_backend: nccl
  dist_url: env://

system:
  num_workers: 14
  device: cuda

wandb:
  use_wandb: true
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: 4m_distill_rgb2pc
