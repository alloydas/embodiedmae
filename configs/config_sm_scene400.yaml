# CONTINUATION of sm_scene_s1 (epoch 200) to epoch 400, into a SEPARATE directory so
# outputs/sm_scene_s1 stays frozen at epoch 200. Built 2026-10-06 as the equal-training
# baseline for sm_scene_mix_sink400: same 200 + 200 schedule, so 400 vs 400 compares
# masking / loss only. Identical to config_sm_scene.yaml except epochs 400 and the output
# path. lr_lambda is a cosine over args.epochs, so resuming at epoch 200 with
# epochs 400 is a WARM RESTART: the learning rate jumps from ~0 to ~0.53x its
# peak (~7.9e-5) and decays to 0 by epoch 400. Report it as "200 + 200 epochs
# with a cosine restart", never as a 400-epoch run.
#
#   INIT_CKPT=outputs/sm_scene_s1/checkpoints/checkpoint_epoch_200.pth \
#     sbatch --job-name=sm_scene400_s1 slurm/sm_arm.sbatch scene400 1
#
# Occluded-scene training, SCENE arm (occlusion_scene.py).
#
# The setup from the occlusion meeting (after 2026-09-29): the input is a
# SCENE -- the target plant with neighbouring plants standing around it, their
# leaves in its RGB, depth and point cloud -- and the reconstruction target is
# the CLEAN target plant alone. The target's procedural params are the
# conditioning: text_mask_ratio 0.0 keeps every param token visible and none is
# reconstructed. Without them nothing says which leaves are the target's.
#
# The two arms differ ONLY in occlusion_scene.prob:
#   config_sm_scene.yaml      prob 0.5 -- half of each batch becomes scenes
#   config_sm_scene_off.yaml  prob 0.0 -- trains clean (the control)
# Both validate on the SAME occluded val scenes (val_occ_* in
# training_history.json, val_occ/* in W&B) as well as clean val, so the
# comparison is the one the meeting asked for.
#
# Scenes are built on the fly from the single-plant renders (in-batch
# neighbours, stood on the target's ground in world coordinates, splatted into
# the images). Alloy's rendered scenes, when they land, are the test set.
#
# Base: config_sm_off.yaml (all four streams, mask 0.80 over the vision
# tokens, QAL, global batch 32, 200 epochs = 65 800 steps, one cosine) -- not
# comparable to the 197 400-step E2/E3/E4 table.
#
#   sbatch --job-name=sm_scene_s1     slurm/sm_arm.sbatch scene 1
#   sbatch --job-name=sm_scene_off_s1 slurm/sm_arm.sbatch scene_off 1
#   sbatch --job-name=sm_scene_noparam_s1 slurm/sm_arm.sbatch scene_noparam 1
#     (config_sm_scene_noparam.yaml: the scene arm without the param stream)

data:
  data_root: /work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K
  # The view folders' *_spline.yml were rewritten 2026-09-30 (no waviness);
  # these are the untouched originals every earlier run's params came from.
  spline_root: /work/mech-ai-scratch/alloy/shorgum_data/SorghumData
  img_size: 224
  num_points: 8196
  view_sampling: true
  view_seed: 42            # identical in both arms: same views, same order

model:
  active_modalities: "pc,rgb,depth,text"
  model_size: base
  mask_ratio: 0.80         # over pc/rgb/depth; text is outside the budget
  text_mask_ratio: 0.0     # params = conditioning: all 25 tokens visible
  loss_name: "qal_loss"
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 24
  occlusion_scene:         # defaults spelled out; config.json records them all
    prob: 0.5              # share of training samples given neighbours
    neighbours: 2          # one each side of a row through the target
    spacing: [0.35, 0.8]   # stem-to-stem, metres (leaves reach ~0.5 m)
    row_jitter: 0.1        # metres off the row line
    yaw: true
    crop_radius: 0.75      # cloud cut to this cylinder around the target stem
    splat_px: 1
    mask_policy: uniform   # neighbour_first = oracle: mask neighbour tokens first
    patch_frac: 0.3
    val_seed: 0            # same val scenes in every arm

training:
  batch_size: 16           # per GPU; the launcher runs 2 GPUs -> global 32
  epochs: 400              # 200 + 200, cosine warm restart at 200
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_epochs: 13
  val_freq: 20             # 10 val points, each clean + occluded
  test_freq: 0
  seed: null               # set per run by the launcher (--seed)

checkpointing:
  output_dir: ./outputs/sm_scene400
  save_freq: 20
  resume: null

visualization:
  viz_freq: 20             # = val_freq: clean + occluded-scene figures to W&B (visualizations/, scene_visualizations/)
  num_viz_samples: 6

distributed:
  world_size: 2
  dist_backend: nccl
  dist_url: env://

system:
  num_workers: 14
  device: cuda

wandb:
  use_wandb: true
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: sm_scene400