# E2 -- modality value-add ablation (CVPR plan Section 5, experiment E2).
# PC + RGB + depth. Isolates what metric depth adds on top of RGB.
#
# CONTROLLED ACROSS ALL FOUR ARMS -- do not edit one arm without the others:
#   identical epoch budget, LR schedule, batch size, mask ratio, loss and seed.
#   The ONLY difference between arms is `active_modalities`.
#
# READ THE RIGHT NUMBER. `loss` sums a different number of terms per arm and is
# NOT comparable across arms; best_model.pth is selected on it, which is correct
# WITHIN an arm and meaningless BETWEEN arms. The cross-arm comparison is
# `pc_chamfer`, computed identically in every arm because PC is always active.
#
# SCHEDULE (plan Section 6.3, reduced fixed schedule). view_sampling makes an epoch
# one drawn view per plant: 10,500 items, not 105,000. 2000 epochs = 21M samples
# seen, about 20% of the 105M the headline run saw. Shorter than E1 by design;
# state it in the paper.

data:
  data_root: /work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K
  img_size: 224
  num_points: 8196
  view_sampling: true      # plan 6.1 -- one view per plant per epoch
  view_seed: 42            # identical in every arm: same views, same order

model:
  active_modalities: "pc,rgb,depth"
  model_size: base
  mask_ratio: 0.80
  loss_name: "qal_loss"
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 24

training:
  batch_size: 8            # per-GPU. GLOBAL BATCH MUST BE 32 IN EVERY ARM -- it is
                           # per-GPU batch x GPU count, so each launcher sets its own:
                           #   e2_arm.sbatch (a100:4)           8 x 4 = 32  <- this value
                           #   e2_arm_blackwell.sbatch (rtx:2) 16 x 2 = 32  <- --batch_size 16
                           # Check outputs/<run>/config.json: batch_size x world_size == 32.
                           # (headline E1 used 64; E2 is internally controlled, not
                           #  matched to E1, which also differs in schedule per 6.3)
  epochs: 2000
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_epochs: 40
  val_freq: 50
  test_freq: 0

checkpointing:
  output_dir: ./outputs/e2_pcrgbd
  save_freq: 25
  resume: null

visualization:
  viz_freq: 0              # the 4-row grid needs all four streams; skipped for reduced arms
  num_viz_samples: 6

distributed:
  world_size: 4            # ignored under torchrun, which infers it from nproc
  dist_backend: nccl
  dist_url: env://

system:
  num_workers: 14
  device: cuda

wandb:
  use_wandb: true
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: e2_pcrgbd
