# EmbodiedMAE-4M cross-modal distillation on the 15k extreme-enriched split.
# All-source variant: every modality in turn conditions the student (rest masked)
# and must regenerate all four. Teacher AND student warm-start from the completed
# 15k pretrain (best_model.pth, epoch 980, val 0.2109) — NOT the old 10k
# 4m_run_v3 ep-2400 base the earlier distill runs used.
#
# Epoch budget note: the 15k train split is 105k folders vs 10k before, so an
# "epoch" is 10.5x bigger. 100 epochs here (~164k steps at global batch 64,
# ~10.5M sample-views) already exceeds the entire 200-epoch run on the old data
# (~250k steps / 2.0M sample-views at batch 8).

data:
  data_root: /work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K
  img_size: 224
  num_points: 8196

model:
  model_size: base
  mask_ratio: 0.80          # matches the teacher's pretraining regime
  # QAL: sigmoid-weighted two-sided Chamfer (ported from yongyun). Errors past
  # qal_threshold get up-weighted, targeting thin-leaf geometry where Chamfer
  # plateaued. pc_loss_weight drops 10.0 -> 1.0 to match the new loss scale,
  # as on the yongyun branch.
  loss_name: "qal_loss"
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 24

distill:
  # v2 teacher: trained with corrected depth decoding, exact mask allocation and
  # the QAL point-cloud loss. The old ./outputs/4m_pretrain_15k/best_model.pth is
  # NOT valid here — it learned luminance-collapsed depth at an effective 0.83 mask.
  teacher_checkpoint: ./outputs/4m_pretrain_15k_v2_depthfix_qal/teacher_final.pth
  student_init:       ./outputs/4m_pretrain_15k_v2_depthfix_qal/teacher_final.pth
  crossmodal_prob: 0.8
  sources: [rgb, depth, pc, text]
  feat_distill_weight: 1.0
  cls_distill_weight: 0.5
  output_distill_weight: 0.0
  distill_masked_only: true
  viz_source: pc            # hardest source — progress is most visible there

training:
  batch_size: 16           # MEASURED 2026-08-21 (jobs 12069257 / 12069794) on 8x RTX
                           # PRO 6000, real 8-GPU DDP incl. val+viz legs:
                           #   bs16 -> 54.4 GiB/card (56%), 301 global samples/s
                           #   bs24 -> 80.5 GiB/card (83%), 324 global samples/s
                           # bs24 is +7.8% throughput for +48% memory (17% headroom),
                           # not worth an OOM on a preemptible job. NOTE: torch-reserved
                           # understates the true footprint by 1.88x — cuDNN/cuBLAS
                           # workspace lives outside the allocator and scales with batch.
                           # bs>=32 only "fits" via cuDNN low-memory fallback, which is
                           # why throughput flatlines there. ~5.8 min/epoch, ~10h for 100 ep.
  epochs: 100
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_epochs: 5
  val_freq: 5
  val_max_batches: 100      # 1600 val samples per source; full 22.5k sweep x4
                            # sources would stall ranks 1-3 past the NCCL timeout

checkpointing:
  output_dir: ./outputs/4m_distill_15k_all
  save_freq: 2            # scavenger is preemptible — keep the resume point close
  resume: null

visualization:
  viz_freq: 10
  num_viz_samples: 6

distributed:
  world_size: 8            # nova26-gpu-1 has 8x RTX PRO 6000 (torchrun overrides this anyway)
  dist_backend: nccl
  dist_url: env://

system:
  num_workers: 24          # 24x8 = 192 workers, leaving ~168 of 360 CPUs for the
                           # 8 training procs. At 44 (352 workers) the node ran at
                           # load 354/360 and rank 0 was starved: GPUs 1-7 spun at
                           # 100% in NCCL wait while GPU 0 sat at 0%. See the
                           # persistent_workers note in train_sorghum_4m_distill.py.
  device: cuda

wandb:
  use_wandb: true
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: distill_15k_allsrc_100ep
