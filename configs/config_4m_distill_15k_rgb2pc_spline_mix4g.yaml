# EmbodiedMAE-4M  RGB -> {POINT CLOUD, SPLINE PARAMS}  specialist distillation.
#
# Every step conditions on RGB alone (depth, PC and spline all masked) and the
# student must generate the point cloud AND the growth parameters. Reconstruction
# loss, feature distillation and the best-model metric are all restricted to
# those two targets — depth and RGB self-reconstruction are not trained here.
#
# Multi-target: `target` takes a list. The recon term is lp + lt (each already
# scaled by pc_loss_weight / spline_loss_weight inside forward_loss), and the
# best-model metric is that same sum — Chamfer (~1e-3) and param MAE (~3e-2)
# cannot share one metric without the larger scale deciding on its own.
#
# 4-GPU variant. Both RTX PRO 6000 nodes were held by other scavenger jobs with
# ~7 days left, so an 8-GPU job would not have started until ~2026-09-02; only 4
# GPUs on nova26-gpu-1 were free. Global batch is therefore 64, not 128, and lr
# is halved to match. This does mean batch and lr differ from the two failed
# specialist runs (12086208, 12087915) as well as crossmodal_prob, so the
# attribution of any improvement to the mixing change alone is not airtight.
#
# 500 epochs on the 105k train split at global batch 64 is ~820k optimizer steps.
# At roughly double the 8-GPU epoch time (~5.7 -> ~11.4 min/epoch) expect ~4 days
# of compute, plus scavenger preemption.

data:
  data_root: /work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K
  img_size: 224
  num_points: 8196

model:
  model_size: base
  mask_ratio: 0.80          # NOW LIVE, unlike the crossmodal_prob 1.0 runs where it
                            # was dead config: it applies to the ~1-in-5 full
                            # reconstruction steps this run reintroduces. 0.80 matches
                            # the regime the v2 teacher was pretrained under.
  loss_name: "qal_loss"     # sigmoid-weighted two-sided Chamfer; matches the teacher
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 24

distill:
  # Frozen snapshot of the v2 pretrain best (epoch 960, val 0.1811). Use the
  # snapshot rather than best_model.pth: that file is rewritten whenever a run
  # improves, and a preempted job re-reads its teacher on every requeue.
  teacher_checkpoint: ./outputs/4m_pretrain_15k_v2_depthfix_qal/teacher_final.pth
  # Warm-start from the best checkpoint of the lr=3e-5 attempt (job 12087915):
  # its epoch 1, val 0.03387 — that run's best was its FIRST validation and it
  # degraded monotonically for the next 62 epochs. That checkpoint is in turn one
  # 3e-5 epoch downstream of the epoch-10 best of the lr=1e-4 attempt (12086208),
  # which peaked at 0.03544 and then degraded the same way. So this is the lowest
  # validation point either specialist attempt ever reached.
  # NOT --resume: resuming restores the old scheduler state, whose base_lr is
  # 1e-4, and would silently undo the change below.
  student_init:       ./outputs/4m_distill_15k_rgb2pc_spline_lr3e5/init_ep1_best.pth
  # 0.8, not 1.0. At 1.0 every one of the 821 steps per epoch is the identical
  # narrow task (one source, two targets) and the student overfits it: two runs
  # (12086208 at lr 1e-4, 12087915 at lr 3e-5) traced the SAME rising validation
  # curve from different starting points, so learning rate was not the cause.
  # At 0.8 one step in five is a normal Dirichlet full-reconstruction step, which
  # restores the regime diversity the all-source run had and keeps depth trained
  # rather than letting it collapse 6x.
  crossmodal_prob: 0.8
  sources: [rgb]
  target: [pc, text]
  feat_distill_weight: 1.0
  cls_distill_weight: 0.5
  output_distill_weight: 0.0
  distill_masked_only: true
  viz_source: rgb

training:
  batch_size: 16            # measured: 54.4 GiB/card on 8x RTX PRO 6000 incl. val+viz.
                            # NOT raised to 32 to recover global batch 128: that would
                            # roughly double per-card memory against a 95 GiB card, and
                            # torch.cuda.max_memory_reserved understates true usage 1.88x
                            # here (cuDNN/cuBLAS workspace sits outside the allocator).
                            # Throughput also flatlines at bs>=32 precisely because cuDNN
                            # falls back to low-memory algorithms.
  epochs: 500
  lr: 1.5e-5                # HALVED from the 8-GPU variant's 3.0e-5 by the linear
                            # scaling rule (lr proportional to global batch), because
                            # this runs on 4 GPUs: global batch 128 -> 64. The 3.0e-5
                            # was itself down from 1.0e-4, at which the student
                            # diverged from epoch 10 on: val pc+text 0.03544 ->
                            # 0.03682 by ep40 and rgb->pc Chamfer 0.00089 -> 0.00101,
                            # while train recon fell 0.0250 -> 0.0222.
  weight_decay: 0.05
  warmup_epochs: 5
  val_freq: 10              # 50 val points over the run; one source, so cheap
  val_max_batches: 100      # 1600 val samples
  max_steps: 0

checkpointing:
  output_dir: ./outputs/4m_distill_15k_rgb2pc_spline_mix4g
  save_freq: 2              # scavenger is preemptible — keep the resume point close
  resume: null

visualization:
  viz_freq: 20
  num_viz_samples: 6

distributed:
  world_size: 4
  dist_backend: nccl
  dist_url: env://

system:
  num_workers: 24           # 192 workers total; 44 starved rank 0 at load 354/360
  device: cuda

wandb:
  use_wandb: true
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: distill_15k_rgb2pcspline_500ep_mix08_4gpu
