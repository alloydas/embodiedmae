# EmbodiedMAE-4M  ·  Cross-modal DISTILLATION config
# Goal: any single modality (rest fully masked) → reconstruct all four.
# Frozen full-modal teacher → warm-started single-modal student.

data:
  data_root: "./Dataset/new_data"
  img_size: 224
  num_points: 8196

model:
  model_size: "base"
  mask_ratio: 0.75          # used only for the mixed-in normal Dirichlet batches
  pc_loss_weight: 10.0
  depth_norm_type: "minmax"
  spline_loss_weight: 5.0
  max_leaves: 24

distill:
  # Frozen teacher (sees ALL modalities) and student warm-start. Use the
  # TRUSTWORTHY final checkpoint (epoch 2400, val 0.0204) — NOT best_model.pth in
  # the same dir, which is the inferior duplicate-run model (val 0.034 @ ep 1800).
  teacher_checkpoint: "./outputs/4m_run_v3/checkpoints/checkpoint_epoch_2400.pth"
  student_init:       "./outputs/4m_run_v3/checkpoints/checkpoint_epoch_2400.pth"

  crossmodal_prob: 0.7              # fraction of steps that are single-modal→all
  sources: ["rgb", "depth", "pc", "text"]   # cycled so each learns to generate the rest

  feat_distill_weight: 1.0          # token-wise MSE on decoder features vs teacher
  cls_distill_weight: 0.5           # MSE on encoder CLS latent vs teacher
  output_distill_weight: 0.0        # >0 also matches teacher's raw predictions
  distill_masked_only: true         # distill only on generated-modality token positions

  viz_source: "depth"               # which source to render each viz epoch (depth = best probe)

training:
  batch_size: 8
  epochs: 800
  lr: 1.0e-4                  # lower than scratch (1.5e-4): student is warm-started
  weight_decay: 0.05
  warmup_epochs: 10
  val_freq: 20

checkpointing:
  output_dir: "./outputs/4m_distill_v1"
  save_freq: 50
  resume: null

visualization:
  viz_freq: 25
  num_viz_samples: 6

distributed:
  world_size: 1               # set >1 for mp.spawn, or launch via torchrun
  dist_backend: "nccl"
  dist_url: "env://"

system:
  num_workers: 8
  device: "cuda"

wandb:
  use_wandb: true
  wandb_project: "embodied-mae-sorghum"
  wandb_entity: null
  wandb_name: "4m_crossmodal_distill_v1"
