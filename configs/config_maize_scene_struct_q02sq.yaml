# QAL-variant twin of config_maize_scene_struct.yaml: identical except the PC loss --
# qal_threshold 0.02 (was 0.01), qal_use_squared true (was false) and
# pc_loss_weight 15.0 (was 1.0). Squaring the distances shrinks the PC term
# 11x at epoch 20 and 17x at epoch 200 (measured on sm_scene_s1's own
# predictions, 2026-10-02, job 16702293), so the weight is raised to keep PC's
# share of the total loss about where it was; at 1.0 the PC head would get
# little gradient (see CLAUDE.md, "Three traps in a QAL sweep").
# Paired with its random-masking (config_maize_scene_q02sq.yaml) twin under the same loss, so the masking-policy
# comparison is not confounded by the loss change. 200 epochs = 65 800 steps,
# like every scene arm.
#
#   sbatch --job-name=maize_scene_struct_q02sq_s1 slurm/maize_scene_arm.sbatch scene_struct_q02sq 1
#
# ---- config_maize_scene_struct.yaml as it was ----------------------------------------------------
# MAIZE occluded-scene training, STRUCTURED-MASKING arm -- the maize twin of
# config_sm_scene_struct.yaml. Identical to config_maize_scene.yaml except
# mask_policy: neighbour_first: on a scene sample, image patches where a
# neighbour shows and PC tokens whose FPS centre is a neighbour point are
# masked FIRST, the rest of the Dirichlet budget uniformly. Validation is
# uniform for every arm, so the two are scored on the same occluded scenes
# under the deployable masking.
#
#   sbatch --job-name=maize_scene_struct_s1 slurm/maize_scene_arm.sbatch scene_struct 1

data:
  data_root: /work/mech-ai-scratch/alloy/Maize
  img_size: 224
  num_points: 8192         # exact point count in pointcloud_cam.ply
  view_sampling: true
  view_seed: 42            # identical in both arms: same views, same order

model:
  active_modalities: "pc,rgb,depth,text"
  model_size: base
  mask_ratio: 0.80         # over pc/rgb/depth; text is outside the budget
  text_mask_ratio: 0.0     # params = conditioning: all 29 tokens visible
  loss_name: "qal_loss"
  qal_threshold: 0.02
  qal_alpha: 100.0
  qal_use_squared: true
  pc_loss_weight: 15.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 28
  occlusion_scene:         # config.json records every field
    prob: 0.5              # share of training samples given neighbours
    neighbours: 2          # one each side of a row through the target
    # Maize plants are ~0.58x sorghum's footprint (95 % of points within 0.30 m
    # of the stem vs 0.52 m; farthest 0.38 vs ~0.9 m), so sorghum's spacing
    # [0.35, 0.8] / crop 0.75 hide only 4 % of a maize target. Calibrated on 64
    # val plants (2026-10-02): spacing [0.15, 0.35] -- a real in-row maize
    # spacing -- hides 11.7 % of the target's pixels with 65 % of the input
    # cloud neighbour (sorghum's defaults on sorghum: 16 % / 60 %); crop 0.45
    # keeps 99.9 % of the target. Preview: reports/scene_preview_maize_val.png.
    spacing: [0.15, 0.35]
    row_jitter: 0.05
    yaw: true
    crop_radius: 0.45
    splat_px: 1
    mask_policy: neighbour_first       # THE change vs config_maize_scene.yaml
    patch_frac: 0.3
    val_seed: 0            # same val scenes in every arm

training:
  batch_size: 16           # per GPU; the launcher runs 2 GPUs -> global 32
  epochs: 200
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_epochs: 13
  val_freq: 20             # 10 val points, each clean + occluded
  test_freq: 0
  seed: null               # set per run by the launcher (--seed)

checkpointing:
  output_dir: ./outputs/maize_scene_struct_q02sq
  save_freq: 20
  resume: null

visualization:
  viz_freq: 20             # clean + occluded-scene figures to W&B
  num_viz_samples: 6

distributed:
  world_size: 2
  dist_backend: nccl
  dist_url: env://

system:
  num_workers: 14
  device: cuda

wandb:
  use_wandb: true
  wandb_project: embodied-mae-maize
  wandb_entity: null
  wandb_name: maize_scene_struct_q02sq
