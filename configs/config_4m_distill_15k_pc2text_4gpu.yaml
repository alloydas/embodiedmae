# PC -> SPLINE PARAMETERS, full Sorghum_15K.
#
# One job: from the point cloud alone, recover the plant's procedural generation
# parameters -- the 9 floats per leaf plus the plant-level terms that the
# generator used to grow it. Every other modality contributes zero encoder
# tokens.
#
# This is the inverse of the whole pipeline: the parameters are what the mesh
# was BUILT from, so recovering them is closer to phenotyping than to
# reconstruction. `mean_gen` in this run's history is param_mae_masked and
# nothing else (train_sorghum_4m_distill.py:435), so the headline number is the
# metric, with no Chamfer term mixed in.
#
# Differences from the rgb2pc_smr50 recipe this is copied from:
#   * sources: [pc]     was [rgb]
#   * target:  [text]      was [pc]. This flips which loss component is the
#     objective: recon_term becomes the Smooth-L1 param loss (already scaled by
#     spline_loss_weight below), and target_token_weight restricts feature
#     distillation to the TEXT tokens, so the teacher is imitated where the
#     answer lives rather than across the whole decoder sequence.
#
# source_mask_ratio stays at 0.5 deliberately. Its demonstrated benefit on
# rgb->pc was not mainly the 5.9% mean gain but that it removed the
# peak-early-then-degrade pattern (best at epoch 23, then drift most of the way
# back to the undistilled teacher by epoch 100). All FOUR previous runs that
# targeted spline params degraded exactly that way, so this is the arm most
# likely to need it. The smr 0.0 comparison arm has NOT been run for this task.
#
# Read the parameter metric with care: a good fraction of the 9 params are
# near-constant across the dataset, so param_mae is flattered by them. Treat
# this run's number as comparable to other runs on this dataset, not as an
# absolute statement of how well the parameters are recovered.
#
# Whole dataset: 10,500 train plants x 10 views = 105,000 renders; val 2,250
# plants x 10 = 22,500. Splits are plant-disjoint.

data:
  data_root: /work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K
  img_size: 224
  num_points: 8196

model:
  model_size: base
  mask_ratio: 0.80          # matches the v2 teacher's own pretraining regime;
                            # governs the ~1-in-5 full-reconstruction steps.
  loss_name: "qal_loss"     # sigmoid-weighted two-sided Chamfer, as the teacher
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0   # NOW THE OBJECTIVE. Same value the teacher was
                            # 20% full-recon steps
  max_leaves: 24

distill:
  teacher_checkpoint: ./outputs/4m_pretrain_15k_v2_depthfix_qal/teacher_final.pth
  # Student starts as a copy of the teacher. student_init (not resume): resume
  # would restore an optimizer/scheduler from another run.
  student_init:       ./outputs/4m_pretrain_15k_v2_depthfix_qal/teacher_final.pth
  crossmodal_prob: 0.8      # 4 of 5 steps are RGB->PC; the 5th is a normal
                            # Dirichlet full-recon step. At 1.0 the non-target
                            # modalities get no gradient and depth collapses
                            # (+606% in run A); one full-recon step in five
                            # repairs it within a single epoch and holds it.
  sources: [pc]
  target:  [text]
  source_mask_ratio: 0.5    # carried over from rgb2pc_smr50; masks half the PC
                            # source over whole -- all 196 tokens -- so the student
                            # infers geometry from a complete photograph and the
                            # source's own recon loss is identically 0. At 0.5 only
                            # 98 tokens survive; the student must infer the point
                            # cloud from half an image, and the masked RGB patches
                            # become real reconstruction targets (so a logged
                            # rgb 0.0000 is no longer expected). Measured effect on
                            # an untrained net: pc loss 3.70 -> 4.28.
                            # The TEACHER stays unmasked -- it sees all four
                            # modalities in full, which is the asymmetry that makes
                            # the distillation target worth anything.
  feat_distill_weight: 1.0  # MSE(student, teacher) decoder features, restricted
                            # by target_token_weight to the 196 PC tokens
  cls_distill_weight: 0.5
  output_distill_weight: 0.0   # outputs supervised by GROUND TRUTH, not by the
                               # teacher's predictions
  distill_masked_only: true
  viz_source: pc

training:
  batch_size: 16            # Measured 54.4 GiB/card on
                            # RTX PRO 6000 incl. val+viz (bs24 -> 80.5 GiB, 83%).
  # 4 GPUs instead of 8, so accumulate 2 micro-batches per optimiser step:
  # 16 x 4 x 2 = the same GLOBAL BATCH 128 the 8-GPU siblings used, and the same
  # 820 optimiser steps per epoch. batch_size stays 16 so the BatchNorm1d layers in
  # PointCloudEmbed still see 16-sample micro-batches -- they are not SyncBatchNorm,
  # so per-GPU batch is what their running stats depend on. Activation memory is
  # unchanged by accumulation: each micro-batch's graph is freed by its own backward.
  accum_steps: 2
  epochs: 100              # MATCHES Arm A's first cosine, which is the schedule that
                          # produced its best (0.00085254 @ep23). Arm A's config now
                          # reads 200 because it was extended mid-flight for a warm
                          # restart; that second cycle only degraded, and comparing
                          # against it would vary the LR schedule as well as the
                          # source masking. 100 epochs at ~8 min is ~13.5 h, inside
                          # the 24 h wall.
  lr: 3.0e-5                # 1e-4 diverged from epoch 10 in run A; 3e-5 is the
                            # highest rate that held.
  weight_decay: 0.05
  warmup_epochs: 5
  val_freq: 1               # every epoch: every prior run peaked at epoch 1-10,
                            # so a coarse grid samples the whole interesting
                            # region at two points.
  val_max_batches: 100      # 1600 val samples, same subset as runs A-D
  max_steps: 0

checkpointing:
  output_dir: ./outputs/4m_distill_15k_pc2text
  save_freq: 5              # every 5 epochs, not 2. At 1.37 GB a checkpoint,
                            # save_freq 2 over 200 epochs is 100 files = 137 GB
                            # on a filesystem at 97%.
  keep_last: 1              # keep only the newest periodic checkpoint; older
                            # ones are pruned after each successful save.
                            # best_model.pth is at output_dir level and is NEVER
                            # pruned, so "last + best" is what survives. It
                            # carries model+optimizer+scheduler+history, so it is
                            # fully resumable on its own. Saves are atomic
                            # (.tmp then os.replace), so a preemption mid-write
                            # cannot destroy the only remaining checkpoint.
  resume: null

visualization:
  viz_freq: 10
  num_viz_samples: 6

distributed:
  world_size: 4
  dist_backend: nccl
  dist_url: env://

system:
  num_workers: 14           # 8 x 14 = 112 workers + 8 mains = 120, inside the
                            # 128-CPU request. 44/rank starved rank 0 at load
                            # 354/360 on this node.
  device: cuda

wandb:
  use_wandb: true
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: distill_15k_pc2text
