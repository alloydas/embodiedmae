# EmbodiedMAE-4M Training Configuration (RGB + Depth + PointCloud + Spline)

data:
  data_root: "./Dataset/new_data"
  img_size: 224
  num_points: 8196

model:
  model_size: "base"
  mask_ratio: 0.15
  pc_loss_weight: 10.0
  depth_norm_type: "minmax"
  spline_loss_weight: 5.0   # weight for text cross-entropy loss (value chars only)
  max_leaves: 24             # max leaves per plant (pad shorter plants)

training:
  batch_size: 8
  epochs: 2400
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_epochs: 10
  val_freq: 20

checkpointing:
  output_dir: "./outputs/4m_run_v3"
  save_freq: 100
  resume: "./outputs/4m_run_v3/checkpoints/checkpoint_epoch_1100.pth"

visualization:
  viz_freq: 50
  num_viz_samples: 12

distributed:
  world_size: 8
  dist_backend: "nccl"
  dist_url: "env://"

system:
  num_workers: 32
  device: "cuda"

wandb:
  use_wandb: true
  wandb_project: "embodied-mae-sorghum"
  wandb_entity: null
  wandb_name: "Try_with_procedorial_parameters_v3"
