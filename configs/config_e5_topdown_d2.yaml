# E5 -- view regime (CVPR plan Section 5, experiment E5; decisions 6.1 / 6.2).
# Arm: e5_topdown_d2 = overhead rig: views 0-1, looking 64 / 44 deg down.
#
# CONTROLLED ACROSS THIS EXPERIMENT -- the ONLY difference between the arms is
# `data.train_views`, the band of the ten-view elevation ladder a plant's one view
# per epoch is drawn from (sorghum_dataset_4m.SorghumDataset4M.train_views):
#   e2_pcrgbdt_d2  all ten views (the full hemisphere; the reference point)
#   e5_topdown_d2  views 0-1    (64 / 44 deg down)
#   e5_horizon_d2  views 4-5    (+-6 deg, a tractor-height pass)
#   e5_single_d2   view 0       (no view augmentation)
# The plant count, the global batch (32) and the schedule are those of e2_pcrgbdt_d2,
# so every arm runs the same 197,400 optimizer steps; only the augmentation pool
# shrinks. val/test stay on view 0 in every arm (deterministic_view), so the probe
# scores each regime on the same images; the E5 question is how much view
# diversity the latent needs, and the per-view elevation sweep answers the rest.
# A separately rendered tractor-pass camera set (plan 6.2) does not exist on disk.
#
# E2 -- modality value-add ablation (CVPR plan Section 5, experiment E2).
# All four. The '+params' arm -- the paper's novelty claim.
#
# CONTROLLED ACROSS ALL FOUR ARMS -- do not edit one arm without the others:
#   identical epoch budget, LR schedule, batch size, mask ratio, loss and seed.
#   The ONLY difference between arms is `active_modalities`.
#
# READ THE RIGHT NUMBER. `loss` sums a different number of terms per arm and is
# NOT comparable across arms; best_model.pth is selected on it, which is correct
# WITHIN an arm and meaningless BETWEEN arms. The cross-arm comparison is
# `pc_chamfer`, computed identically in every arm because PC is always active.
#
# SCHEDULE (plan Section 6.3, reduced fixed schedule). view_sampling makes an epoch
# one drawn view per plant: 10,500 items, not 105,000.
#
# Sized in OPTIMIZER STEPS, which is the only unit comparable across runs with
# different epoch sizes and global batches:
#   E1 headline v2 : 105,000 / 256 =  410 steps/ep x 1000 ep = 410,000 steps
#   E2 @ 600 ep    :  10,500 /  32 =  328 steps/ep x  600 ep = 197,000 steps
# So E2 runs ~48% of the headline's steps -- a genuinely reduced schedule, as 6.3
# asks. (An earlier 2000 here was wrong: 656,000 steps is 160% of the headline,
# i.e. an "ablation" trained harder than the model it ablates.)
#
# Report the schedule difference in the paper; 6.3 says reviewers accept it stated.

data:
  data_root: /work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K
  rgb_file: rgb_nobg.png   # black background; data version 2
  img_size: 224
  num_points: 8196
  view_sampling: true      # plan 6.1 -- one view per plant per epoch
  view_seed: 42            # identical in every arm: same views, same order
  train_views: [0, 1]       # E5: overhead rig: views 0-1, looking 64 / 44 deg down

model:
  active_modalities: "pc,rgb,depth,text"
  model_size: base
  mask_ratio: 0.80
  loss_name: "qal_loss"
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 24

training:
  batch_size: 8            # per-GPU. GLOBAL BATCH MUST BE 32 IN EVERY ARM -- it is
                           # per-GPU batch x GPU count, so each launcher sets its own:
                           #   e2_arm.sbatch (a100:4)           8 x 4 = 32  <- this value
                           #   e2_arm_blackwell.sbatch (rtx:2) 16 x 2 = 32  <- --batch_size 16
                           # Check outputs/<run>/config.json: batch_size x world_size == 32.
                           # (headline E1 used global 256: batch_size 32 on 8 GPUs.
                           #  E2 is internally controlled, not matched to E1.)
  epochs: 600
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_epochs: 40
  val_freq: 25             # 24 val points over 600 epochs
  test_freq: 0

checkpointing:
  output_dir: ./outputs/e5_topdown_d2
  save_freq: 25
  resume: null

visualization:
  viz_freq: 0              # the 4-row grid needs all four streams; skipped for reduced arms
  num_viz_samples: 6

distributed:
  world_size: 4            # ignored under torchrun, which infers it from nproc
  dist_backend: nccl
  dist_url: env://

system:
  num_workers: 14
  device: cuda

wandb:
  use_wandb: true
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: e5_topdown_d2
