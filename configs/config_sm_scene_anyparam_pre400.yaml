# ANY-TO-ANY, CONTINUED TO 400 EPOCHS (sorghum). config_sm_scene_anyparam_pre.yaml with epochs 400 and its own output
# dir, started from sm_scene_anyparam_pre_s1's epoch-200 checkpoint through the launcher's INIT_CKPT (used
# only when this run has no checkpoint of its own, so a preempted continuation resumes from
# its latest epoch). A cosine WARM RESTART at 200, as the *_scene_mix_sink400 runs: report it
# as "200 + 200 epochs with a cosine restart". Goal: the no-card reconstruction reaching what
# the card-given mixed + Sinkhorn 400 model does WITH the card (occluded test F1@10mm 0.384).
# The student_init in the distill block is ignored on a resume.
#
#   INIT_CKPT=outputs/sm_scene_anyparam_pre_s1/checkpoints/checkpoint_epoch_200.pth \
#     sbatch --job-name=sm_scene_anyparam_pre400_s1 slurm/sm_arm.sbatch scene_anyparam_pre400 1
#
data:
  data_root: /work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K
  # The view folders' *_spline.yml were rewritten 2026-09-30 (no waviness);
  # these are the untouched originals every earlier run's params came from.
  spline_root: /work/mech-ai-scratch/alloy/shorgum_data/SorghumData
  img_size: 224
  num_points: 8196
  view_sampling: true
  view_seed: 42            # identical in both arms: same views, same order

model:
  active_modalities: "pc,rgb,depth,text"
  model_size: base
  mask_ratio: 0.80         # over pc/rgb/depth; text is outside the budget
  text_mask_ratio: null      # parameters inside the Dirichlet budget (see distill.visible_mode)
  loss_name: "qal_loss"
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  pc_sinkhorn_weight: 0.5     # x Sinkhorn divergence, added to the QAL term (pc_sinkhorn.py); as config_*_scene_sink.yaml
  pc_sinkhorn_points: 1024
  pc_sinkhorn_blur: 0.02
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 24
  occlusion_scene:         # defaults spelled out; config.json records them all
    prob: 0.5              # share of training samples given neighbours
    neighbours: 2          # one each side of a row through the target
    spacing: [0.35, 0.8]   # stem-to-stem, metres (leaves reach ~0.5 m)
    row_jitter: 0.1        # metres off the row line
    yaw: true
    crop_radius: 0.75      # cloud cut to this cylinder around the target stem
    splat_px: 1
    mask_policy: neighbour_first   # THE change vs config_sm_scene.yaml
    nf_prob: 0.5           # half the scene samples neighbour-first, half uniform
    patch_frac: 0.3
    val_seed: 0            # same val scenes in every arm

training:
  batch_size: 16           # per GPU; the launcher runs 2 GPUs -> global 32
  epochs: 400              # 200 + 200, cosine warm restart at 200
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_epochs: 13
  val_freq: 20             # 10 val points, each clean + occluded
  test_freq: 0
  seed: null               # set per run by the launcher (--seed)

checkpointing:
  output_dir: ./outputs/sm_scene_anyparam_pre400
  save_freq: 20
  resume: null

visualization:
  viz_freq: 20             # = val_freq: clean + occluded-scene figures to W&B (visualizations/, scene_visualizations/)
  num_viz_samples: 6

distributed:
  world_size: 2
  dist_backend: nccl
  dist_url: env://

system:
  num_workers: 14
  device: cuda

wandb:
  use_wandb: true
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: sm_scene_anyparam_pre400

distill:
  student_init: /work/mech-ai-scratch/alloy/embodiedmae/outputs/4m_pretrain_15k_v2_depthfix_qal/checkpoints/checkpoint_epoch_1000.pth
  param_hide_prob: 0.5
  visible_mode: budget
  feat_weight: 0.0
  cls_weight: 0.0
  val_text_mask_ratio: 1.0
  seed: 0
