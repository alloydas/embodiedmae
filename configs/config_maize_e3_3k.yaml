# E3 MAIZE -- data scaling on the maize split. Arm: 3k.
#
# THE MAIZE TWIN of configs/config_e3_3k.yaml. Run it with
# train_maize_4m.py via slurm/scale_arm_maize.sbatch -- NEVER the sorghum entry
# point, which would build a 9-param/24-leaf model and glob '*_nc_cam.ply',
# matching nothing in the maize tree.
#
# CONTROLLED ACROSS THIS EXPERIMENT -- do not edit one arm without the others.
# The ONLY difference between the arms of this experiment is `data.max_plants`.
#
# EQUAL OPTIMIZER STEPS, NOT EQUAL EPOCHS. An epoch under view_sampling is one
# drawn view per plant, so its size is the plant count. Running every arm for the
# same number of epochs would hand the larger arm proportionally more gradient
# updates and the curve would measure data scale and compute jointly. Every arm
# runs ~197,400 optimizer steps -- the same budget as maize_4m
# (329 steps/ep x 600 ep), which is this experiment's full-data / base-model
# point, and the same budget as sorghum's E2/E3/E4 so the two species compare.
#
#   arm              plants  steps/ep   epochs   = steps
#   maize_e3_1k        1000        32     6169   = 197,408
#   maize_e3_3k        3000        94     2100   = 197,400
#   maize_e3_10k      10000       313      631   = 197,503
#   maize_4m          10500       329      600   = 197,400  <- ckpt:
#                                    outputs/maize_4m/checkpoints/checkpoint_epoch_600.pth
#
# USE checkpoint_epoch_600.pth FOR maize_4m, NOT best_model.pth. maize_4m is
# continued to epoch 1000 by slurm/train_maize_1000.sbatch. That job READS
# outputs/maize_4m and WRITES outputs/maize_4m_1000ep, so this directory stays
# frozen at 600 epochs / 197,400 steps -- but the 1000-epoch model exists and is
# 329,000 steps with a cosine restart in it. Comparing these arms against the
# 1000-epoch model would put a 329,000-step point in the middle of a curve of
# 197,400-step points and, for E4, invert the model-scaling result with no error
# message anywhere.
#
# Maize and sorghum have IDENTICAL split sizes (10,500 / 2,250 / 2,250 plants),
# which is why these epoch counts are the same as the sorghum arms' rather than
# rescaled. That is a fact about the two datasets, not a copy-paste.
#
# warmup_epochs, val_freq and save_freq are scaled by the same factor, so every
# arm warms up over the same fraction of its schedule and lands ~24 val points.
#
# READ THE RIGHT NUMBER: compare arms on `pc_chamfer`, not `loss`.

data:
  data_root: /work/mech-ai-scratch/alloy/Maize
  img_size: 224
  num_points: 8192         # maize pointcloud_cam.ply holds EXACTLY 8192 points
  view_sampling: true      # plan 6.1 -- one view per plant per epoch
  view_seed: 42            # identical in every arm: same views, same order
  max_plants: 3000        # E3: train on 3000 of the 10,500 train plants
  plant_subset_seed: 42    # nested subsets: 1k subset of 3k subset of 10k

model:
  active_modalities: "pc,rgb,depth,text"
  model_size: base
  mask_ratio: 0.80
  loss_name: "qal_loss"
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 28           # maize: 1 plant token + 28 leaf slots

training:
  batch_size: 8            # per-GPU. GLOBAL BATCH MUST BE 32 IN EVERY ARM:
                           #   scale_arm_maize.sbatch (rtx:2)  16 x 2 = 32
                           # Check outputs/<run>/config.json: batch_size x world_size == 32.
  epochs: 2100
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_epochs: 140
  val_freq: 88
  test_freq: 0

checkpointing:
  output_dir: ./outputs/maize_e3_3k
  save_freq: 88
  resume: null

visualization:
  viz_freq: 0              # no grids for ablation arms; the numbers are the point
  num_viz_samples: 6

distributed:
  world_size: 4            # ignored under torchrun, which infers it from nproc

system:
  num_workers: 14
  device: cuda

wandb:
  use_wandb: true
  wandb_project: embodied-mae-maize
  wandb_entity: null
  wandb_name: maize_e3_3k
