# CLEAN crossmodal_prob TEST — the controlled rerun of run C (job 12099830).
#
# This file is run B's config (`config_4m_distill_15k_rgb2pc_spline_lr3e5.yaml`,
# job 12087915) with EXACTLY ONE substantive change: crossmodal_prob 1.0 -> 0.8.
# Same student_init, same teacher, same lr 3e-5, same batch_size 16 x 8 GPUs =
# global 128, same warmup, same epochs. Only val_freq changes, and that affects
# measurement rather than training.
#
# Why it exists: run C tested xm 0.8 but ALSO halved lr (3e-5 -> 1.5e-5) and batch
# (128 -> 64), because no 8-GPU slot was free. Halved lr alone predicts the halved
# degradation that was observed, so run C could not attribute anything to mixing.
# Both RTX PRO 6000 nodes are idle now, so the controlled version is possible.
#
# `epochs: 500` is DELIBERATE and must not be lowered. The cosine schedule's period
# is derived from it, so shortening the run to e.g. 60 epochs would change the lr at
# every single epoch and reintroduce exactly the confound this file exists to remove.
# The run is meant to be CANCELLED BY HAND around epoch 60 — matching how far run B
# got (62) — not to reach 500. Nothing past epoch ~10 has helped in any run so far.
#
# See SPECIALIST_DISTILL_rgb2pc_spline.md for the three runs this follows.
data:
  data_root: /work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K
  img_size: 224
  num_points: 8196

model:
  model_size: base
  mask_ratio: 0.80          # LIVE here, unlike run B: it governs the ~1-in-5 full
                            # reconstruction steps that crossmodal_prob 0.8 introduces.
                            # 0.80 matches the v2 teacher's own pretraining regime.
  loss_name: "qal_loss"     # sigmoid-weighted two-sided Chamfer; matches the teacher
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 24

distill:
  # Frozen snapshot of the v2 pretrain best (epoch 960, val 0.1811). Use the
  # snapshot rather than best_model.pth: that file is rewritten whenever a run
  # improves, and a preempted job re-reads its teacher on every requeue.
  teacher_checkpoint: ./outputs/4m_pretrain_15k_v2_depthfix_qal/teacher_final.pth
  # Warm-start from the epoch-10 best of the lr=1e-4 attempt (job 12086208),
  # which peaked there and then degraded for 30 straight epochs while train loss
  # kept falling. NOT --resume: resuming restores the old scheduler state, whose
  # base_lr is 1e-4, and would silently undo the change below.
  student_init:       ./outputs/4m_distill_15k_rgb2pc_spline/init_ep10_best.pth
  crossmodal_prob: 0.8      # THE ONE VARIABLE UNDER TEST. 1.0 in run B: every step
                            # the identical narrow task. At 0.8 one step in five is a
                            # normal Dirichlet full-reconstruction step.
  sources: [rgb]
  target: [pc, text]
  feat_distill_weight: 1.0
  cls_distill_weight: 0.5
  output_distill_weight: 0.0
  distill_masked_only: true
  viz_source: rgb

training:
  batch_size: 8             # 8 x 2 GPUs = global 16 (run D was 128, run B 128). This is a
                            # SHORT FEASIBILITY RUN, not a continuation of the run D series --
                            # at global 16 the gradient noise scale is 8x run D's and the
                            # numbers are not comparable to any prior run.
  epochs: 500
  lr: 3.0e-5                # was 1.0e-4. At that peak the student diverged from
                            # epoch 10 on: val pc+text 0.03544 -> 0.03682 by ep40
                            # and rgb->pc Chamfer 0.00089 -> 0.00101, while train
                            # recon fell 0.0250 -> 0.0222. Fresh cosine from here.
  weight_decay: 0.05
  warmup_epochs: 5
  val_freq: 1               # was 10. Every run so far peaked at epoch 1 or 10, so a
                            # 10-epoch grid samples the entire interesting region at two
                            # points. Validation is 100 batches, forward-only, one source.
                            # Run B's coarse grid is why its epoch-1 peak was ambiguous.
  val_max_batches: 100      # 1600 val samples
  max_steps: 0

checkpointing:
  output_dir: ./outputs/4m_distill_15k_rgb2pc_spline_xm08_clean
  save_freq: 2              # scavenger is preemptible — keep the resume point close
  resume: null

visualization:
  viz_freq: 20
  num_viz_samples: 6

distributed:
  world_size: 2            # 4 GPUs, down from 8. NOTE: under torchrun this key is IGNORED --
                           # main() overwrites cfg.world_size from $WORLD_SIZE (line ~796), which
                           # comes from the sbatch's NPROC = $SLURM_GPUS_ON_NODE. The value that
                           # actually decides this is the job's GRES. Kept in sync for the record.
  dist_backend: nccl
  dist_url: env://

system:
  num_workers: 2            # 2 ranks x 2 = 4 workers + 2 mains = 6 procs on a 4-CPU
                            # allocation -- DELIBERATELY oversubscribed. At 1 worker/rank
                            # the epoch costs 177 min, which exceeds the 2h walltime, so
                            # the job would be killed mid-epoch-1 having saved nothing.
                            # At 2/rank it is ~88 min/epoch and one epoch completes.
                            # These workers are I/O-blocked most of the time, so
                            # oversubscription costs little here.
  device: cuda

wandb:
  use_wandb: true
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: distill_15k_rgb2pcspline_xm08_clean
