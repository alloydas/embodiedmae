# EmbodiedMAE-4M -- PAPER RUN maskboth_s1: blobs + edge weighting (length_scale 0.20, center_bias 1.5) -- also the QAL loss baseline
#
# Paper-grade protocol, matched to the main programme so these rows can sit in
# the same table as E1-E4:
#   * 56 400 optimizer steps = 600 epochs at 94 steps/epoch (3 000 plants, one
#     view per plant per epoch). The first runs at this setting show PC
#     F1@0.03 rising from 0.60 to 0.73 between epochs 200 and 250 and reaching
#     0.83-0.84 by epoch 550-600, where the curve has flattened -- so the
#     comparison happens after the transition, not before it. This is SHORTER
#     than the programme's 197 400-step budget (e3_3k / e2_pcrgbdt) and must be
#     labelled as a short-schedule ablation wherever these rows are reported.
#   * ONE cosine schedule from scratch (no 30k run + warm restart), warmup over
#     the same 3 % of the schedule as before, ~42 validation points.
#   * Global batch 32 (8 per GPU x 4 GPUs); fixed 225-view clean val; occluded
#     val under the shared 1x reference corruption.
#   * seed 1. Arms that carry a claim are run at seeds 1 and 2, so a
#     difference can be checked against run-to-run spread instead of assumed.
#
# The 30 000-step sweep that preceded this is screening only -- its numbers are
# before the recall transition and its gaps were inside the seed gap.
#
# Submit the whole set:  sbatch train_4m_paper.sbatch

data:
  data_root: "/work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K"
  img_size: 224
  num_points: 8196

model:
  model_size: "base"
  mask_ratio: 0.75
  loss_name: "qal_loss"
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  sinkhorn_loss_weight: 0
  sinkhorn_num_points: 512
  sinkhorn_blur: 0.02
  sinkhorn_p: 2
  sinkhorn_scaling: 0.8
  sinkhorn_backend: "tensorized"
  sinkhorn_debias: true
  pc_loss_weight: 1.0
  pc_deterministic_fps: true
  pc_add_center_coordinates: true
  depth_norm_type: "minmax"
  spline_loss_weight: 5.0
  max_leaves: 24
  structured_mask:
    enabled: true
    prob: 0.5
    center_bias: 1.5
    length_scale: 0.20
    modalities: [rgb, depth, pc]
    shared_field: true
    apply_in_eval: false

occlusion:
  enabled: true
  prob: 1.0
  num_leaves: [9, 16]
  reach: [0.6, 1.2]
  width: [0.09, 0.18]
  bend: 0.25
  heading_jitter_deg: 35
  depth_scale: [0.8, 0.95]     # ignored: depth_quantile is set
  depth_quantile: [0.0, 0.8]
  rgb_noise_std: 0.03      # VARIED (1x sensor noise)
  depth_noise_std: 0.015    # VARIED
  pc_noise_std: 0.008       # VARIED
  occlude_pc: true
  min_pc_keep: 0.35
  eval_occluded: true
  # Reference corruption for the occluded val pass -- identical in all four
  # configs. Training noise above varies; this does not.
  eval_occlusion:
    rgb_noise_std: 0.03
    depth_noise_std: 0.015
    pc_noise_std: 0.008

training:
  batch_size: 8
  lr: 5.0e-5
  weight_decay: 0.05
  warmup_epochs: 19
  val_freq: 15
  epochs: 2400              # overridden by max_steps; kept for resume bookkeeping
  max_steps: 56400          # 600 epochs at 94 steps/epoch (see the header)
  num_train_plants: 3000    # plant-level, not view-level
  views_per_epoch: 1
  num_val_samples: 225      # same fixed clean val as the 10k runs
  seed: 1

checkpointing:
  output_dir: "./outputs/paper_maskboth_s1"
  save_freq: 30
  resume: null

visualization:
  viz_freq: 40
  num_viz_samples: 6

evaluation:
  pc_metric_thresholds: [0.01, 0.02, 0.03]
  pc_metric_chunk_size: 512
  val_mask_seed: 42

distributed:
  world_size: 4
  dist_backend: "nccl"
  dist_url: "env://"

system:
  num_workers: 32
  device: "cuda"

wandb:
  use_wandb: true
  wandb_project: "embodied-mae-sorghum"
  wandb_entity: null
  wandb_name: "paper_maskboth_s1"
