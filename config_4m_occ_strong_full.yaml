# EmbodiedMAE-4M -- heavy occlusion + structured masking on the FULL dataset.
#
# Based on config_4m_occ_strong_10k.yaml (job 12268322) with three changes:
#
# 1. FULL DATA: all 105,000 train / 22,500 val samples (no subset caps).
# 2. length_scale 0.35 (same as 12268322; the 0.20 v2 run is not used here).
# 3. eval_occluded: false -- no second, occluded validation pass. Occlusion is
#    a TRAINING-only augmentation here; validation, best-model selection and
#    metrics/* use clean inputs exactly as before. The wandb picture of the
#    training regime (visualizations_occ: occluded val samples + structured
#    blobs) is still drawn -- pictures only, no metrics, nothing learned.
#
# Run with:
#   sbatch --account=mech-ai train_4m_occ_strong_full.sbatch

data:
  data_root: "/work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K"
  img_size: 224
  num_points: 8196

model:
  model_size: "base"
  mask_ratio: 0.75
  # QAL: sigmoid-weighted, two-sided Euclidean Chamfer distance.
  loss_name: "qal_loss"
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  sinkhorn_loss_weight: 0
  sinkhorn_num_points: 512
  sinkhorn_blur: 0.02
  sinkhorn_p: 2
  sinkhorn_scaling: 0.8
  sinkhorn_backend: "tensorized"
  sinkhorn_debias: true
  pc_loss_weight: 1.0
  pc_deterministic_fps: true
  pc_add_center_coordinates: true
  depth_norm_type: "minmax"
  spline_loss_weight: 5.0
  max_leaves: 24
  # Unchanged from config_4m_occlusion.yaml -- this run varies the input
  # occlusion, not the token-mask geometry.
  structured_mask:
    enabled: true
    prob: 0.5
    center_bias: 1.5
    length_scale: 0.35
    modalities: [rgb, depth, pc]
    shared_field: true
    apply_in_eval: false

# Same strength as strong_small; only the leaf depth model changes.
# Encoder input only; the loss still sees the clean targets.
occlusion:
  enabled: true
  prob: 1.0                # was 0.5 -- every training sample is occluded
  num_leaves: [9, 16]      # was [4, 10]
  reach: [0.6, 1.2]        # was [0.5, 1.0]; base at 1.1, so >1.1 crosses centre
  width: [0.09, 0.18]      # was [0.06, 0.14]
  bend: 0.25
  heading_jitter_deg: 35
  depth_scale: [0.8, 0.95]  # ignored: depth_quantile is set
  depth_quantile: [0.0, 0.8]  # leaf depth = this quantile of the plant's depth, z-tested
  rgb_noise_std: 0.03      # was 0.02
  depth_noise_std: 0.015   # was 0.01
  pc_noise_std: 0.008      # was 0.005
  occlude_pc: true
  min_pc_keep: 0.35        # was 0.5 -- see header
  eval_occluded: false     # training-only occlusion; no occluded val pass

training:
  batch_size: 8
  epochs: 2400
  lr: 5.0e-5
  weight_decay: 0.05
  warmup_epochs: 10
  val_freq: 10
  # Full dataset: no num_train_samples / num_val_samples caps.

checkpointing:
  output_dir: "./outputs/4m_occ_strong_full"
  # ~3,300 steps per epoch on the full data.
  save_freq: 10
  resume: null

visualization:
  viz_freq: 10
  num_viz_samples: 6

evaluation:
  pc_metric_thresholds: [0.01, 0.02, 0.03]
  pc_metric_chunk_size: 512
  val_mask_seed: 42

distributed:
  world_size: 4
  dist_backend: "nccl"
  dist_url: "env://"

system:
  num_workers: 32
  device: "cuda"

wandb:
  use_wandb: true
  wandb_project: "embodied-mae-sorghum"
  wandb_entity: null
  wandb_name: "occ_strong_full"
