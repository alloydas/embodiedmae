# EmbodiedMAE-4M -- RECIPE SELECTION run D: small mask blobs, DOUBLE the sensor noise
#
# One of four candidates that differ ONLY in the two lines marked "VARIED".
# Everything else -- data, budget, schedule, evaluation -- is identical, so the
# four training_history.json files can be read straight into a comparison table
# (python compare_recipes.py).
#
# Protocol
#   * 3,000 plants (plant-level subset, nested across sizes by val_mask_seed),
#     one randomly drawn view per plant per epoch -> 3,000 samples/epoch,
#     94 steps/epoch at 4 GPUs x batch 8.
#   * 30,000 optimiser steps for every candidate (epochs are derived from it),
#     so a candidate cannot win by training longer.
#   * Clean val: the same fixed 225 views and val_mask_seed as the earlier
#     10k runs; best_model.pth is still selected on clean val loss.
#   * Occluded val: `occlusion.eval_occlusion` pins the eval corruption to the
#     1x noise reference in all four configs, so metrics_occ/* compares runs
#     under one identical corruption instead of each under its own.
#
# Run all four:  sbatch train_4m_recipe.sbatch      (job array 0-3)
# Single run:    sbatch --export=ALL,CONFIG=config_4m_recipe_d_ls020_noise2x.yaml train_4m_recipe.sbatch

data:
  data_root: "/work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K"
  img_size: 224
  num_points: 8196

model:
  model_size: "base"
  mask_ratio: 0.75
  loss_name: "qal_loss"
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  sinkhorn_loss_weight: 0
  sinkhorn_num_points: 512
  sinkhorn_blur: 0.02
  sinkhorn_p: 2
  sinkhorn_scaling: 0.8
  sinkhorn_backend: "tensorized"
  sinkhorn_debias: true
  pc_loss_weight: 1.0
  pc_deterministic_fps: true
  pc_add_center_coordinates: true
  depth_norm_type: "minmax"
  spline_loss_weight: 5.0
  max_leaves: 24
  structured_mask:
    enabled: true
    prob: 0.5
    center_bias: 1.5
    length_scale: 0.20     # VARIED
    modalities: [rgb, depth, pc]
    shared_field: true
    apply_in_eval: false

occlusion:
  enabled: true
  prob: 1.0
  num_leaves: [9, 16]
  reach: [0.6, 1.2]
  width: [0.09, 0.18]
  bend: 0.25
  heading_jitter_deg: 35
  depth_scale: [0.8, 0.95]     # ignored: depth_quantile is set
  depth_quantile: [0.0, 0.8]
  rgb_noise_std: 0.06      # VARIED (2x sensor noise)
  depth_noise_std: 0.03    # VARIED
  pc_noise_std: 0.016       # VARIED
  occlude_pc: true
  min_pc_keep: 0.35
  eval_occluded: true
  # Reference corruption for the occluded val pass -- identical in all four
  # configs. Training noise above varies; this does not.
  eval_occlusion:
    rgb_noise_std: 0.03
    depth_noise_std: 0.015
    pc_noise_std: 0.008

training:
  batch_size: 8
  lr: 5.0e-5
  weight_decay: 0.05
  warmup_epochs: 10
  val_freq: 10
  epochs: 2400              # overridden by max_steps; kept for resume bookkeeping
  max_steps: 30000          # the real budget: ~320 epochs at 94 steps/epoch
  num_train_plants: 3000    # plant-level, not view-level
  views_per_epoch: 1
  num_val_samples: 225      # same fixed clean val as the 10k runs

checkpointing:
  output_dir: "./outputs/recipe_d_ls020_noise2x"
  save_freq: 40
  resume: null

visualization:
  viz_freq: 40
  num_viz_samples: 6

evaluation:
  pc_metric_thresholds: [0.01, 0.02, 0.03]
  pc_metric_chunk_size: 512
  val_mask_seed: 42

distributed:
  world_size: 4
  dist_backend: "nccl"
  dist_url: "env://"

system:
  num_workers: 32
  device: "cuda"

wandb:
  use_wandb: true
  wandb_project: "embodied-mae-sorghum"
  wandb_entity: null
  wandb_name: "recipe_d_ls020_noise2x"
