# EmbodiedMAE-4M — heavy occlusion on a small subset.
#
# Two changes vs config_4m_occlusion.yaml, both asked for to iterate faster and
# harder on the amodal-completion regime:
#
# 1. STRONGER OCCLUSION. Measured on 16 Sorghum_15K val views x 8 draws
#    (the same protocol that tuned the defaults):
#
#                            plant covered            plant px covered
#                          mean     p90    PC drop   centre r<0.3  border r>0.6
#      defaults (prob 0.5)  3.6%   11.5%     2.1%        0.1%          7.6%
#      here                28.7%   44.5%    20.5%       11.2%         45.7%
#
#    Every sample is occluded (prob 1.0) by more, longer and wider leaves.
#    Coverage is ~8x the default and the point cloud loses a fifth of its
#    points, but the centre still sees 4x less occlusion than the border, so
#    the "centre plant is rarely covered" property the field motivates
#    survives. Pushing further (leaves [10,20], width to 0.24, reach to 1.4)
#    measured 54% coverage with the centre at 37% -- that erases the contrast,
#    so it was backed off to these values.
#    min_pc_keep drops 0.5 -> 0.35: at this occlusion strength samples would
#    otherwise trip the floor, and ProceduralOcclusion.__call__ then hands them
#    their FULL cloud back -- an all-or-nothing PC stream. At 0.35 no sample in
#    the measurement kept an unoccluded cloud.
#
# 2. SMALL SUBSET. train 1050 / val 225 (1% of 105,000 / 22,500), fixed by
#    val_mask_seed so every run in this series sees the same samples. The
#    full-data occlusion run (job 12261050) needed ~21 h to reach epoch 18;
#    at 1/100 the data an epoch is ~33 steps on 4 GPUs, so the occlusion
#    setting itself can be judged in hours rather than weeks. Generalisation
#    numbers from this run are NOT comparable to the full-data ones -- it will
#    overfit; read it for "does the model learn under heavy occlusion at all".
#
# Preview what the occlusion looks like before training:
#   python vis_plant_occlusion.py --config config_4m_occ_strong_small.yaml \
#       --split val --num_samples 4 --output vis_occ_strong.png
# Run with:
#   sbatch --account=mech-ai train_4m_occ_strong_small.sbatch

data:
  data_root: "/work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K"
  img_size: 224
  num_points: 8196

model:
  model_size: "base"
  mask_ratio: 0.75
  # QAL: sigmoid-weighted, two-sided Euclidean Chamfer distance.
  loss_name: "qal_loss"
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  sinkhorn_loss_weight: 0
  sinkhorn_num_points: 512
  sinkhorn_blur: 0.02
  sinkhorn_p: 2
  sinkhorn_scaling: 0.8
  sinkhorn_backend: "tensorized"
  sinkhorn_debias: true
  pc_loss_weight: 1.0
  pc_deterministic_fps: true
  pc_add_center_coordinates: true
  depth_norm_type: "minmax"
  spline_loss_weight: 5.0
  max_leaves: 24
  # Unchanged from config_4m_occlusion.yaml -- this run varies the input
  # occlusion, not the token-mask geometry.
  structured_mask:
    enabled: true
    prob: 0.5
    center_bias: 1.5
    length_scale: 0.35
    modalities: [rgb, depth, pc]
    shared_field: true
    apply_in_eval: false

# THE CHANGE. Encoder input only; the loss still sees the clean targets.
occlusion:
  enabled: true
  prob: 1.0                # was 0.5 -- every training sample is occluded
  num_leaves: [9, 16]      # was [4, 10]
  reach: [0.6, 1.2]        # was [0.5, 1.0]; base at 1.1, so >1.1 crosses centre
  width: [0.09, 0.18]      # was [0.06, 0.14]
  bend: 0.25
  heading_jitter_deg: 35
  depth_scale: [0.8, 0.95]
  rgb_noise_std: 0.03      # was 0.02
  depth_noise_std: 0.015   # was 0.01
  pc_noise_std: 0.008      # was 0.005
  occlude_pc: true
  min_pc_keep: 0.35        # was 0.5 -- see header
  eval_occluded: true      # occluded val pass -> metrics_occ/* in wandb

training:
  batch_size: 8
  epochs: 2400
  lr: 5.0e-5
  weight_decay: 0.05
  warmup_epochs: 10
  val_freq: 10
  # 1% subsets, fixed by val_mask_seed.
  num_train_samples: 1050
  num_val_samples: 225

checkpointing:
  output_dir: "./outputs/4m_occ_strong_small"
  # Epochs are ~100x cheaper here, so checkpoint/visualise on epoch counts that
  # keep the output directory a sane size rather than every 20 epochs.
  save_freq: 100
  resume: null

visualization:
  viz_freq: 50
  num_viz_samples: 6

evaluation:
  pc_metric_thresholds: [0.01, 0.02, 0.03]
  pc_metric_chunk_size: 512
  val_mask_seed: 42

distributed:
  world_size: 4
  dist_backend: "nccl"
  dist_url: "env://"

system:
  num_workers: 32
  device: "cuda"

wandb:
  use_wandb: true
  wandb_project: "embodied-mae-sorghum"
  wandb_entity: null
  wandb_name: "occ_strong_small_1050"
