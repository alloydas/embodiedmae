# EmbodiedMAE-4M -- heavy occlusion, 10% train subset, interleaved leaf depth.
#
# Changes vs config_4m_occ_strong_small.yaml (same occlusion strength):
#
# 1. TRAIN 10,500 samples (10% of 105,000) instead of 1,050. Val stays at the
#    same fixed 225 samples, so the clean / occluded val numbers stay cheap and
#    comparable with the 1,050 run. Both subsets are fixed by val_mask_seed.
#
# 2. INTERLEAVED DEPTH (occlusion.depth_quantile). The strong_small run puts
#    every leaf in front of the whole plant (depth_scale: 0.8-0.95 x its
#    nearest depth), so in depth the occluders are a separate, easy-to-spot
#    layer. Real neighbour leaves sit at about the same distance and weave in
#    and out of the plant. Here each leaf gets a depth inside the plant's own
#    depth range and is z-tested per pixel: it hides the plant only where it is
#    nearer, and in the cloud only the points behind it are removed.
#
# Preview:
#   python vis_plant_occlusion.py --config config_4m_occ_strong_10k.yaml \
#       --split val --num_samples 4 --output vis_occ_strong_10k.png
# Run with:
#   sbatch --account=mech-ai train_4m_occ_strong_10k.sbatch

data:
  data_root: "/work/mech-ai-scratch/alloy/shorgum_data/new_data_50K/Sorghum_15K"
  img_size: 224
  num_points: 8196

model:
  model_size: "base"
  mask_ratio: 0.75
  # QAL: sigmoid-weighted, two-sided Euclidean Chamfer distance.
  loss_name: "qal_loss"
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  sinkhorn_loss_weight: 0
  sinkhorn_num_points: 512
  sinkhorn_blur: 0.02
  sinkhorn_p: 2
  sinkhorn_scaling: 0.8
  sinkhorn_backend: "tensorized"
  sinkhorn_debias: true
  pc_loss_weight: 1.0
  pc_deterministic_fps: true
  pc_add_center_coordinates: true
  depth_norm_type: "minmax"
  spline_loss_weight: 5.0
  max_leaves: 24
  # Unchanged from config_4m_occlusion.yaml -- this run varies the input
  # occlusion, not the token-mask geometry.
  structured_mask:
    enabled: true
    prob: 0.5
    center_bias: 1.5
    length_scale: 0.35
    modalities: [rgb, depth, pc]
    shared_field: true
    apply_in_eval: false

# Same strength as strong_small; only the leaf depth model changes.
# Encoder input only; the loss still sees the clean targets.
occlusion:
  enabled: true
  prob: 1.0                # was 0.5 -- every training sample is occluded
  num_leaves: [9, 16]      # was [4, 10]
  reach: [0.6, 1.2]        # was [0.5, 1.0]; base at 1.1, so >1.1 crosses centre
  width: [0.09, 0.18]      # was [0.06, 0.14]
  bend: 0.25
  heading_jitter_deg: 35
  depth_scale: [0.8, 0.95]  # ignored: depth_quantile is set
  depth_quantile: [0.0, 0.8]  # leaf depth = this quantile of the plant's depth, z-tested
  rgb_noise_std: 0.03      # was 0.02
  depth_noise_std: 0.015   # was 0.01
  pc_noise_std: 0.008      # was 0.005
  occlude_pc: true
  min_pc_keep: 0.35        # was 0.5 -- see header
  eval_occluded: true      # occluded val pass -> metrics_occ/* in wandb

training:
  batch_size: 8
  epochs: 2400
  lr: 5.0e-5
  weight_decay: 0.05
  warmup_epochs: 10
  val_freq: 10
  # 10% train subset / same 225 val samples, fixed by val_mask_seed.
  num_train_samples: 10500
  num_val_samples: 225

checkpointing:
  output_dir: "./outputs/4m_occ_strong_10k_interleave"
  # ~330 steps per epoch (10x strong_small), so save / visualise more often.
  save_freq: 20
  resume: null

visualization:
  viz_freq: 10
  num_viz_samples: 6

evaluation:
  pc_metric_thresholds: [0.01, 0.02, 0.03]
  pc_metric_chunk_size: 512
  val_mask_seed: 42

distributed:
  world_size: 4
  dist_backend: "nccl"
  dist_url: "env://"

system:
  num_workers: 32
  device: "cuda"

wandb:
  use_wandb: true
  wandb_project: "embodied-mae-sorghum"
  wandb_entity: null
  wandb_name: "occ_strong_10k_interleave"
